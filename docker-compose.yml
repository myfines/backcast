services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment:
      BACKCAST_DB: /data/backcast.sqlite3
    volumes:
      - backcast-data:/data
    restart: unless-stopped
  web:
    build:
      context: ./apps/web
      args:
        API_BASE_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    restart: unless-stopped
volumes:
  backcast-data:
